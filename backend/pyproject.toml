[project]
name = "backend"
version = "0.1.0"
description = "FastAPI Backend for Mapping Project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dnspython>=2.9.0",
    "fastapi>=0.141.1",
    "groq>=0.37.1",
    "langchain-core>=1.5.6",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.19.0",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.5",
    "uvicorn[standard]>=0.52.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
